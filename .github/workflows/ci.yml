name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, and specifying both makes it refuse to start.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The client suite includes a live interop test that spawns the real
      # Elixir server and drives a session through it. Without Elixir that test
      # skips itself, so this job needs a BEAM even though it is the TypeScript
      # one. The guard step below fails the build if it ever skips anyway.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27'

      # Frozen: CI must fail on a lockfile that drifted from package.json
      # rather than silently resolving something different from local dev.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck against the real @iwsdk/core
        run: pnpm typecheck

      - run: pnpm test

      - name: Fail if the interop test silently skipped
        # The interop suite skips itself when Elixir is missing, so a green run
        # would otherwise hide the loss of all cross-runtime coverage. Assert
        # the tests actually executed rather than merely that the file was seen
        # — a skipped suite still prints its own name.
        working-directory: packages/client
        run: |
          npx vitest run test/interop.test.ts 2>&1 | tee /tmp/interop.log
          if grep -qi "skipped" /tmp/interop.log; then
            echo "::error::interop suite skipped — Elixir unavailable, cross-runtime coverage lost"
            exit 1
          fi
          grep -qE "Tests +[0-9]+ passed" /tmp/interop.log

      - run: pnpm build

      - name: Verify the golden vectors are current
        # Regenerating must be a no-op. A diff here means the wire format
        # changed without the fixture being updated, which would let the two
        # implementations drift apart silently.
        run: |
          node scripts/generate-fixtures.mjs
          git diff --exit-code fixtures/protocol_vectors.tsv

  server:
    name: Server (Elixir)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.15'
            otp: '25'
          - elixir: '1.17'
            otp: '27'
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            packages/server/deps
            packages/server/_build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('packages/server/mix.exs') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Core suite, with no dependencies at all
        # Proves the protocol, spatial-grid, physics and room layers stay
        # dependency-free. If this breaks, something leaked a dependency into
        # the core.
        #
        # MIX_BUILD_ROOT is load-bearing: without it this compiles _build/test
        # with an empty dependency list, and the real `mix test` below reuses
        # that same directory and finds RoomChannel missing. Giving this run its
        # own build root keeps the two from poisoning each other.
        working-directory: packages/server
        run: IWSDK_CORE_ONLY=1 MIX_BUILD_ROOT=_build_core mix test
        env:
          MIX_ENV: test

      - run: mix deps.get
        working-directory: packages/server

      - name: Check formatting
        working-directory: packages/server
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        working-directory: packages/server
        run: mix compile --warnings-as-errors

      - name: Assert RoomChannel actually compiled
        # It is conditionally compiled on Phoenix being present, so a build
        # problem would silently drop it and every channel test would skip —
        # green, with the Phoenix-facing surface untested.
        working-directory: packages/server
        run: |
          mix run --no-start -e '
            unless Code.ensure_loaded?(IwsdkPhoenix.RoomChannel) do
              IO.puts(:stderr, "RoomChannel was not compiled despite Phoenix being available")
              System.halt(1)
            end
          '
        env:
          MIX_ENV: test

      - name: Full suite, including RoomChannel against a real Phoenix
        working-directory: packages/server
        run: mix test
